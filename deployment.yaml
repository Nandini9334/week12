
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seleniumtestdemo-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: seleniumtestdemo
  template:
    metadata:
      labels:
        app: seleniumtestdemo
    spec:
      containers:
        - name: seleniumtestdemo
          image: nandini9334/week8:seleniumimage1
          ports:
            - containerPort: 5050
