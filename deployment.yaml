apiVersion: apps/v1
kind: Deployment
metadata:
  name: seleniumtestdemo-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: seleniumtestdemo
  template:
    metadata:
      labels:
        app:seleniumtestdemo
    spec:
      containers:
        - name: seleniumtestdemo
          image: nandini9334/week8:v1 # use your Docker Hub image
          ports:
            - containerPort: 5050